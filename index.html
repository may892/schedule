<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>班級與教師查詢系統</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 600px;
      margin: 0 auto;
    }
    .search-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
    }
    input[type="search"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }
    .result-box {
      margin-top: 15px;
      padding: 10px;
      background-color: #f4f4f9;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h2>班級與教師速查</h2>

  <!-- 1. 依教師查詢 (結合下拉與輸入搜尋) -->
  <div class="search-group">
    <label for="teacherInput">依教師查詢：</label>
    <input 
      type="search" 
      id="teacherInput" 
      list="teacherList" 
      placeholder="點擊選擇或輸入教師姓名關鍵字..."
      autocomplete="off"
    >
    <datalist id="teacherList">
      <!-- 選單選項由 JavaScript 動態渲染 -->
    </datalist>
  </div>

  <!-- 2. 依班級查詢 (結合下拉與輸入搜尋) -->
  <div class="search-group">
    <label for="classInput">依班級查詢：</label>
    <input 
      type="search" 
      id="classInput" 
      list="classList" 
      placeholder="點擊選擇或輸入班級名稱關鍵字..."
      autocomplete="off"
    >
    <datalist id="classList">
      <!-- 選單選項由 JavaScript 動態渲染 -->
    </datalist>
  </div>

  <div class="result-box" id="resultDisplay">
    請點擊或輸入內容進行查詢...
  </div>

  <script>
    // 模擬資料 (可替換為實際 API 或是 JSON 檔資料)
    const mockTeachers = [
      { id: "T01", name: "張小明", department: "資訊科" },
      { id: "T02", name: "李美麗", department: "英文科" },
      { id: "T03", name: "王大同", department: "數學科" },
      { id: "T04", name: "張哲豪", department: "物理科" }
    ];

    const mockClasses = [
      { id: "C101", name: "資一甲" },
      { id: "C102", name: "資一乙" },
      { id: "C201", name: "英二甲" },
      { id: "C301", name: "數三甲" }
    ];

    // 確保 DOM 渲染完畢後執行，避免抓不到元素的錯誤
    document.addEventListener('DOMContentLoaded', () => {
      initDropdowns();
      bindEvents();
    });

    // 初始化選單資料 (渲染至 datalist)
    function initDropdowns() {
      const teacherDatalist = document.getElementById('teacherList');
      const classDatalist = document.getElementById('classList');

      // 渲染教師選單
      teacherDatalist.innerHTML = mockTeachers.map(t => 
        `<option value="${t.name}">工號: ${t.id} - ${t.department}</option>`
      ).join('');

      // 渲染班級選單
      classDatalist.innerHTML = mockClasses.map(c => 
        `<option value="${c.name}">代碼: ${c.id}</option>`
      ).join('');
    }

    // 監聽輸入與選擇事件
    function bindEvents() {
      const teacherInput = document.getElementById('teacherInput');
      const classInput = document.getElementById('classInput');
      const resultDisplay = document.getElementById('resultDisplay');

      // 監聽教師查詢
      teacherInput.addEventListener('input', (e) => {
        const value = e.target.value.trim();
        const found = mockTeachers.find(t => t.name === value);
        if (found) {
          resultDisplay.innerHTML = `<strong>查詢成功：</strong> 教師 [${found.name}] (${found.department})`;
        } else if (value) {
          resultDisplay.innerHTML = `正在搜尋與「${value}」相關的教師...`;
        } else {
          resultDisplay.innerHTML = `請點擊或輸入內容進行查詢...`;
        }
      });

      // 監聽班級查詢
      classInput.addEventListener('input', (e) => {
        const value = e.target.value.trim();
        const found = mockClasses.find(c => c.name === value);
        if (found) {
          resultDisplay.innerHTML = `<strong>查詢成功：</strong> 班級 [${found.name}]`;
        } else if (value) {
          resultDisplay.innerHTML = `正在搜尋與「${value}」相關的班級...`;
        } else {
          resultDisplay.innerHTML = `請點擊或輸入內容進行查詢...`;
        }
      });
    }
  </script>
</body>
</html>
