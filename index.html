<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課表查詢系統</title>
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div class="app-container">
    <!-- 頂部標頭（已拿掉 HLHS） -->
    <header class="header">
      <div class="logo-title">
        <h1>課表查詢系統</h1>
      </div>
      <div class="info-stats" id="stats-info">載入中...</div>
    </header>

    <!-- 頂部控制面板 -->
    <div class="control-panel">
      <nav class="tab-bar">
        <button class="tab-btn active" data-mode="high">高中班級</button>
        <button class="tab-btn" data-mode="junior">國中班級</button>
        <button class="tab-btn" data-mode="teacher">依教師</button>
        <button class="tab-btn" data-mode="room">依教室</button>
      </nav>

      <!-- 帶有搜尋/輸入過濾功能的下拉選單 -->
      <div class="select-wrapper">
        <input 
          type="text" 
          id="item-search" 
          list="item-options" 
          class="dropdown-select" 
          placeholder="-- 請搜尋或選擇 高中班級 --" 
          autocomplete="off"
        >
        <datalist id="item-options">
          <!-- JS 動態生成選項 -->
        </datalist>
      </div>
    </div>

    <!-- 課表內容區 -->
    <main class="content">
      <div class="content-header">
        <h2 id="current-title">請選擇查詢項目</h2>
      </div>

      <div class="table-scroll-container">
        <table class="schedule-table">
          <thead>
            <tr>
              <th class="col-period">節次</th>
              <th>週一</th>
              <th>週二</th>
              <th>週三</th>
              <th>週四</th>
              <th>週五</th>
            </tr>
          </thead>
          <tbody id="schedule-body">
            <!-- 動態生成 1~8 節 -->
          </tbody>
        </table>
      </div>

      <div class="footer-note">
        💡 點選課表內加底線的<span class="highlight">教師/班級/教室</span>可直接切換查詢
      </div>
    </main>
  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
